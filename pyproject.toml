[project]
name = "payload-cache"
version = "0.1.0"
description = "Caching microservice that generates interleaved payloads from transformed strings, plus a CLI client."
readme = "README.md"
authors = [
    { name = "Simeone Umoh", email = "simeoneumoh@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cache-cli = "payload_cache.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
